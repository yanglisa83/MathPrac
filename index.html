<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Adventures</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Adventures">
<meta name="theme-color" content="#4da3e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #cfe8ff;
    --pink-deep: #4da3e8;
    --lav: #dbeeff;
    --lav-deep: #2f6fb0;
    --text: #234b6b;
    --card: #f5fbff;
    --shadow: 0 8px 0 rgba(70, 150, 210, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 64px;
    background: radial-gradient(circle at 20% 10%, #eaf8ff 0%, #b7e6ff 45%, #7cc9f5 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    position: relative;
    overflow-x: hidden;
  }
  .cloud {
    position: fixed;
    background: #ffffff;
    border-radius: 100px;
    opacity: 0.92;
    z-index: 0;
    pointer-events: none;
    animation: drift ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .cloud1 { width: 130px; height: 42px; top: 6%; left: 6%; animation-duration: 26s; }
  .cloud1::before { width: 62px; height: 62px; top: -32px; left: 14px; }
  .cloud1::after { width: 48px; height: 48px; top: -20px; left: 58px; }

  .cloud2 { width: 95px; height: 32px; top: 14%; left: 68%; animation-duration: 34s; }
  .cloud2::before { width: 46px; height: 46px; top: -22px; left: 10px; }
  .cloud2::after { width: 38px; height: 38px; top: -16px; left: 42px; }

  .cloud3 { width: 150px; height: 46px; top: 40%; left: -6%; animation-duration: 40s; }
  .cloud3::before { width: 72px; height: 72px; top: -36px; left: 20px; }
  .cloud3::after { width: 56px; height: 56px; top: -24px; left: 66px; }

  .cloud4 { width: 105px; height: 34px; top: 68%; left: 78%; animation-duration: 30s; }
  .cloud4::before { width: 50px; height: 50px; top: -24px; left: 12px; }
  .cloud4::after { width: 42px; height: 42px; top: -18px; left: 44px; }

  .cloud5 { width: 80px; height: 28px; top: 85%; left: 20%; animation-duration: 22s; }
  .cloud5::before { width: 40px; height: 40px; top: -20px; left: 8px; }
  .cloud5::after { width: 32px; height: 32px; top: -14px; left: 34px; }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(45px); }
  }
  body::before {
    content: "🎀 ✨ 🩵 ⭐ ☁️ ✨ 🎀 ⭐ 🩵 ☁️ ✨ 🎀 ⭐";
    position: fixed;
    inset: 0;
    font-size: 22px;
    letter-spacing: 40px;
    line-height: 90px;
    opacity: 0.15;
    z-index: 0;
    pointer-events: none;
    word-break: break-all;
    overflow: hidden;
  }
  .wrap { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    text-align: center;
    margin: 0 0 4px;
    color: #1f6fb8;
    text-shadow: 2px 2px 0 #fff;
  }
  .subtitle {
    text-align: center;
    color: var(--text);
    font-weight: 600;
    margin: 0 0 28px;
  }
  .mascot-row {
    text-align: center;
    font-size: 2.4rem;
    margin-bottom: 10px;
  }
  .topic-grid {
    display: grid;
    gap: 18px;
  }
  .topic-card {
    display: block;
    background: var(--card);
    border: 3px solid #fff;
    outline: 3px solid var(--pink-deep);
    border-radius: 26px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease;
  }
  .topic-card:hover { transform: translateY(-3px); }
  .topic-card .emoji { font-size: 2rem; margin-bottom: 8px; }
  .topic-card h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.25rem;
    margin: 0 0 6px;
    color: #1f6fb8;
  }
  .topic-card p { margin: 0; font-weight: 600; }
  .topic-card.coming-soon {
    opacity: 0.6;
    outline-style: dashed;
    pointer-events: none;
  }
  .topic-card.coming-soon .tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.8rem;
    background: var(--lav);
    color: var(--lav-deep);
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 700;
  }
  footer {
    text-align: center;
    color: #1f6fb8;
    font-size: 0.85rem;
    margin-top: 28px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<div class="cloud cloud4"></div>
<div class="cloud cloud5"></div>
<div class="wrap">
  <div class="mascot-row">🐰🎀🐱🩵🐹</div>
  <h1>Math Adventures</h1>
  <p class="subtitle">Pick a topic to practice!</p>

  <div class="topic-grid">
    <a class="topic-card" href="distance.html">
      <div class="emoji">🚗</div>
      <h2>Distance = Rate × Time</h2>
      <p>Word problems about speed, time, and how far things travel.</p>
    </a>

    <div class="topic-card coming-soon">
      <div class="emoji">📐</div>
      <h2>Area</h2>
      <p>Word problems about calculating area.</p>
      <span class="tag">Coming soon</span>
    </div>
  </div>

  <footer>Made with 💙 for math adventurers everywhere.</footer>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline caching unavailable, ignore */ });
    });
  }
</script>
</body>
</html>
